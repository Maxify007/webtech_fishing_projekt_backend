name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # 👇 this is the correct place
    defaults:
      run:
        working-directory: fishing

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle setup & caching
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build Backend
        run: ./gradlew build

      # Optional: build already runs tests, so this is redundant,
      # but if you want to keep it explicit, it's fine:
      - name: Run Backend Tests
        run: ./gradlew test
